<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Configuration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 font-sans min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Symmetrical Header -->
    <div class="w-full max-w-3xl text-center mb-8 mt-4">
        <h1 class="text-3xl font-bold text-white tracking-wide">AI Configuration Portal</h1>
        <p class="text-slate-400 text-sm mt-2">Manage prompt architecture, guardrails, and persona.</p>
    </div>

    <!-- Pill-Style Tabs (Matching Food Truck UI) -->
    <div class="w-full max-w-3xl flex justify-center flex-wrap gap-3 mb-6">
        <button class="tab-btn px-6 py-2.5 text-sm font-bold rounded-full bg-white text-black transition" data-target="tab-strategy">Strategy & Audience</button>
        <button class="tab-btn px-6 py-2.5 text-sm font-bold rounded-full bg-[#1E293B] text-slate-400 border border-slate-700 hover:bg-slate-800 transition" data-target="tab-persona">Persona & Beliefs</button>
        <button class="tab-btn px-6 py-2.5 text-sm font-bold rounded-full bg-[#1E293B] text-slate-400 border border-slate-700 hover:bg-slate-800 transition" data-target="tab-rules">Guardrails & Rules</button>
    </div>

    <!-- Main Content Card -->
    <div class="w-full max-w-3xl bg-[#1E293B] border border-slate-700 rounded-3xl shadow-2xl p-6 md:p-8 mb-12">

        <!-- TAB 1: STRATEGY & AUDIENCE -->
        <div id="tab-strategy" class="tab-content space-y-6">
            
            <!-- Framework Row & Action Buttons -->
            <div class="flex items-end gap-3">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Framework Presets</label>
                    <select id="frameworkSelect" class="w-full bg-black border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-teal-500">
                        <option value="PAS">Problem-Agitate-Solution (PAS)</option>
                        <option value="AIDA">Attention-Interest-Desire-Action (AIDA)</option>
                        <option value="Direct">Cutthroat Direct Response</option>
                        <option value="Story">Narrative Storytelling</option>
                    </select>
                </div>
                <button id="loadConfigBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition">Load</button>
                <button id="saveConfigBtn" class="bg-[#0D9488] hover:bg-teal-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition">Save</button>
            </div>

            <!-- Target Audience Input -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Target Audience Profiles</label>
                <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[50px] flex flex-wrap gap-2 focus-within:border-teal-500" id="audienceContainer">
                    <input type="text" id="audienceInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[150px] p-1" placeholder="Type and press Enter (e.g. 'older people')">
                </div>
            </div>

            <!-- Pain Point Manager -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Customer Pain Points to Agitate</label>
                <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[50px] flex flex-wrap gap-2 focus-within:border-teal-500" id="painContainer">
                    <input type="text" id="painInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[150px] p-1" placeholder="Type and press Enter...">
                </div>
            </div>

            <!-- Solution Prompt Area -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Solution Prompt</label>
                <textarea id="solutionInput" class="w-full h-24 bg-black text-slate-200 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-teal-500 resize-none" placeholder="Describe the solution delivery, core offer, or value proposition..."></textarea>
            </div>

            <!-- CTA Builder -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Call-To-Action (CTA) Instructions</label>
                <textarea id="ctaInput" class="w-full h-20 bg-black text-slate-200 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-teal-500 resize-none" placeholder="Define exact closing conversion instructions..."></textarea>
            </div>
        </div>

        <!-- TAB 2: PERSONA & BELIEFS -->
        <div id="tab-persona" class="tab-content hidden space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="flex justify-between text-sm font-semibold mb-2 text-slate-300">
                        <span>Energy Level</span>
                        <span id="energyLabel" class="text-teal-400">Neutral (5)</span>
                    </label>
                    <input type="range" id="energySlider" min="1" max="10" value="5" class="w-full accent-teal-500">
                    <div class="flex justify-between text-xs text-slate-500 mt-1">
                        <span>Calm</span><span>High Energy</span>
                    </div>
                </div>
                <div>
                    <label class="flex justify-between text-sm font-semibold mb-2 text-slate-300">
                        <span>Tone</span>
                        <span id="toneLabel" class="text-teal-400">Balanced (5)</span>
                    </label>
                    <input type="range" id="toneSlider" min="1" max="10" value="5" class="w-full accent-teal-500">
                    <div class="flex justify-between text-xs text-slate-500 mt-1">
                        <span>Relatable</span><span>Authoritative</span>
                    </div>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Editable Core Beliefs -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Core Beliefs (Inject Brand Values)</label>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newBeliefInput" class="flex-1 bg-black border border-slate-700 rounded-xl p-2 text-sm text-white focus:outline-none focus:border-teal-500" placeholder="Add a new core belief (e.g. 'Precision over Speed')">
                    <button id="addBeliefBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition">+</button>
                </div>
                <div id="beliefsList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Dynamically populated via JS -->
                </div>
            </div>
        </div>

        <!-- TAB 3: GUARDRAILS & RULES -->
        <div id="tab-rules" class="tab-content hidden space-y-6">
            
            <!-- Vocabulary Guardrails -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Vocabulary: Must Use</label>
                    <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[80px] flex flex-wrap gap-2" id="vocabUseContainer">
                        <input type="text" id="vocabUseInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[100px] p-1" placeholder="Add phrase...">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Vocabulary: Strictly Avoid</label>
                    <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[80px] flex flex-wrap gap-2" id="vocabAvoidContainer">
                        <input type="text" id="vocabAvoidInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[100px] p-1" placeholder="Add phrase...">
                    </div>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Constraint Guardrails -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Constraint Rules: Must Do</label>
                    <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[80px] flex flex-wrap gap-2" id="ruleDoContainer">
                        <input type="text" id="ruleDoInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[100px] p-1" placeholder="Add positive rule...">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">Constraint Rules: Strictly Avoid</label>
                    <div class="bg-black border border-slate-700 rounded-xl p-2 min-h-[80px] flex flex-wrap gap-2" id="ruleAvoidContainer">
                        <input type="text" id="ruleAvoidInput" class="bg-transparent text-sm text-white outline-none flex-1 min-w-[100px] p-1" placeholder="Add negative rule...">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- UI Logic & State Management -->
    <script>
        const state = {
            framework: 'PAS',
            audience: [],
            painPoints: [],
            solution: "",
            cta: "",
            energy: 5,
            tone: 5,
            beliefs: [
                { text: "Honesty over Sales", active: true },
                { text: "Precision over Speed", active: true },
                { text: "Nurturing Approach", active: false }
            ],
            vocabUse: [],
            vocabAvoid: [],
            rulesDo: [],
            rulesAvoid: []
        };

        // --- Tab Navigation ---
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active styling from all
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-white', 'text-black');
                    b.classList.add('bg-[#1E293B]', 'text-slate-400', 'border', 'border-slate-700');
                });
                // Add active styling to clicked
                btn.classList.add('bg-white', 'text-black');
                btn.classList.remove('bg-[#1E293B]', 'text-slate-400', 'border', 'border-slate-700');
                
                // Toggle content
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.target).classList.remove('hidden');
            });
        });

        // --- Tag Input Generator ---
        function setupTagInput(inputId, containerId, stateArrayKey) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);

            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && input.value.trim() !== '') {
                    e.preventDefault();
                    state[stateArrayKey].push(input.value.trim());
                    input.value = '';
                    renderTags(container, state[stateArrayKey], stateArrayKey);
                }
            });
        }

        function renderTags(container, array, stateArrayKey) {
            Array.from(container.querySelectorAll('.pill-tag')).forEach(el => el.remove());
            
            array.forEach((text, index) => {
                const tag = document.createElement('div');
                tag.className = 'pill-tag bg-slate-800 border border-slate-600 text-xs px-3 py-1.5 rounded-full flex items-center gap-2 text-slate-200';
                tag.innerHTML = `
                    ${text}
                    <button class="text-slate-400 hover:text-red-400 focus:outline-none font-bold" onclick="removeTag('${stateArrayKey}', ${index}, '${container.id}')">✕</button>
                `;
                container.insertBefore(tag, container.lastElementChild);
            });
        }

        window.removeTag = function(stateArrayKey, index, containerId) {
            state[stateArrayKey].splice(index, 1);
            renderTags(document.getElementById(containerId), state[stateArrayKey], stateArrayKey);
        };

        setupTagInput('audienceInput', 'audienceContainer', 'audience');
        setupTagInput('painInput', 'painContainer', 'painPoints');
        setupTagInput('vocabUseInput', 'vocabUseContainer', 'vocabUse');
        setupTagInput('vocabAvoidInput', 'vocabAvoidContainer', 'vocabAvoid');
        setupTagInput('ruleDoInput', 'ruleDoContainer', 'rulesDo');
        setupTagInput('ruleAvoidInput', 'ruleAvoidContainer', 'rulesAvoid');

        // --- Editable Core Beliefs ---
        const beliefsList = document.getElementById('beliefsList');
        const newBeliefInput = document.getElementById('newBeliefInput');
        const addBeliefBtn = document.getElementById('addBeliefBtn');

        function renderBeliefs() {
            beliefsList.innerHTML = '';
            state.beliefs.forEach((belief, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-black p-3 rounded-xl border border-slate-700';
                div.innerHTML = `
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-4 h-4 accent-teal-500 rounded" ${belief.active ? 'checked' : ''} onchange="toggleBelief(${index}, this.checked)">
                        <span class="text-sm ${belief.active ? 'text-white' : 'text-slate-500'}">${belief.text}</span>
                    </label>
                    <button class="text-slate-500 hover:text-red-400 px-2" onclick="deleteBelief(${index})">✕</button>
                `;
                beliefsList.appendChild(div);
            });
        }

        window.toggleBelief = function(index, isChecked) {
            state.beliefs[index].active = isChecked;
            renderBeliefs();
        };

        window.deleteBelief = function(index) {
            state.beliefs.splice(index, 1);
            renderBeliefs();
        };

        function addNewBelief() {
            const val = newBeliefInput.value.trim();
            if (val) {
                state.beliefs.push({ text: val, active: true });
                newBeliefInput.value = '';
                renderBeliefs();
            }
        }
        
        addBeliefBtn.addEventListener('click', addNewBelief);
        newBeliefInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addNewBelief();
        });

        renderBeliefs();

        // --- Sliders ---
        document.getElementById('energySlider').addEventListener('input', (e) => {
            state.energy = e.target.value;
            let label = e.target.value < 4 ? "Calm" : e.target.value > 7 ? "High Energy" : "Neutral";
            document.getElementById('energyLabel').innerText = `${label} (${e.target.value})`;
        });

        document.getElementById('toneSlider').addEventListener('input', (e) => {
            state.tone = e.target.value;
            let label = e.target.value < 4 ? "Relatable" : e.target.value > 7 ? "Authoritative" : "Balanced";
            document.getElementById('toneLabel').innerText = `${label} (${e.target.value})`;
        });

        // --- Save Action ---
        document.getElementById('saveConfigBtn').addEventListener('click', () => {
            // Update manual text inputs to state before saving
            state.framework = document.getElementById('frameworkSelect').value;
            state.solution = document.getElementById('solutionInput').value;
            state.cta = document.getElementById('ctaInput').value;

            const jsonPayload = JSON.stringify(state, null, 2);
            console.log("Saving to Database:", jsonPayload);
            alert("Configuration Saved! Check console to see JSON payload.");
        });

    </script>
</body>
</html>
